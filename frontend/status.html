<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status da matrícula — Creche RJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="brand"><span class="mark" aria-hidden="true"></span> Inscrição Creche</div>
</header>

<div class="stepper-bar">
  <ol class="stepper" aria-hidden="true">
    <li class="stepper-step done"><span class="dot">1</span></li>
    <li class="stepper-line done"></li>
    <li class="stepper-step done"><span class="dot">2</span></li>
    <li class="stepper-line done"></li>
    <li class="stepper-step done"><span class="dot">3</span></li>
    <li class="stepper-line done"></li>
    <li class="stepper-step active"><span class="dot">4</span></li>
  </ol>
  <p class="stepper-label">Etapa 4 de 4 — Status da matrícula</p>
</div>

<main class="container">
  <p class="eyebrow">Status</p>
  <h1 class="page-title">Matrícula</h1>
  <p class="page-lede">O resultado final da sua inscrição.</p>

  <div id="conteudo-status"></div>

  <div style="margin-top:16px;text-align:center;">
    <a href="login.html" class="link-btn" onclick="Api.sair();">Entrar com outra inscrição</a>
  </div>
</main>

<script src="api.js"></script>
<script src="app.js"></script>
<script>App.initStatus();</script>
</body>
</html>
