<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comprovação de documentos — Match Carioca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-shell-perfil="familia" data-shell-etapa="2">

<header class="app-header">
  <div class="brand"><span class="mark" aria-hidden="true"></span> Match Carioca</div>
</header>

<div class="stepper-bar">
  <ol class="stepper" aria-hidden="true">
    <li class="stepper-step done"><span class="dot">1</span></li>
    <li class="stepper-line done"></li>
    <li class="stepper-step active"><span class="dot">2</span></li>
    <li class="stepper-line"></li>
    <li class="stepper-step"><span class="dot">3</span></li>
    <li class="stepper-line"></li>
    <li class="stepper-step"><span class="dot">4</span></li>
  </ol>
  <p class="stepper-label">Etapa 2 de 4 — Comprovação de documentos</p>
</div>

<main class="container">
  <p class="eyebrow">Comprovação</p>
  <h1 class="page-title">Para onde levar os documentos</h1>
  <p class="page-lede">Escolhemos a unidade entre as suas preferências mais perto do bairro informado. Você pode trocar se preferir.</p>

  <div id="conteudo-verificacao"></div>

  <div class="sticky-cta">
    <button type="button" id="cta-continuar" class="btn btn-primary btn-block">Continuar e acompanhar minha fila</button>
  </div>
</main>

<script src="api.js"></script>
<script src="app.js"></script>
<script>App.initVerificacao();</script>
<script src="shell.js"></script>
</body>
</html>
