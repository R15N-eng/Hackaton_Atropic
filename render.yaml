services:
  - type: web
    name: hackaton-atropic-api
    runtime: python
    rootDir: backend
    plan: free
    # O motor (pessoa_1/, irmã de backend/) gera data/*.parquet a partir dos
    # CSVs da SME -- gitignorado de proposito (regenerado, nao commitado),
    # entao o build precisa gerar antes do uvicorn subir. ~10s (DuckDB +
    # geocodificacao via openpyxl).
    buildCommand: pip install -r requirements.txt && cd .. && python -m pessoa_1.build_data --ano 2025
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_SCHEDULER
        value: "false"
